# Builds the package and runs the headless audit, swift test, the Python tests, the public
# export and the public guard on a GitHub-hosted macOS runner. Checks that need an installed
# CLI or a real Team-stats store print SKIP there; sourcekit-lsp waits stretch under CI.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-audit:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Remote/OrreryRelay/package-lock.json
      - name: Relay dependencies and real network tests
        working-directory: Remote/OrreryRelay
        run: npm ci && npm test
      - name: Build
        run: swift build
      - name: Cross-device smoke check
        run: .build/debug/Orrery --audit --activity-only
      - name: Headless audit (no provider quota is used)
        run: .build/debug/Orrery --audit
      - name: Tests
        run: swift test
      - name: Installer and public export checks
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Verify public source package
        run: python3 scripts/export_public.py
      - name: Public tree and history guard
        run: |
          git config user.name 'Orrery Maintainers'
          git config user.email 'maintainers@users.noreply.github.com'
          python3 scripts/public_guard.py --history HEAD
